name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    # Repo variable RUNS_ON (a JSON array, e.g. ["ubuntu-latest"]) overrides the self-hosted Mac default.
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","macOS"]') }}
    strategy:
      matrix:
        # Rule 8: Node 22 on pull requests, 20 and 22 on main.
        node: ${{ github.event_name == 'pull_request' && fromJSON('[22]') || fromJSON('[20,22]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run build
      # A spare port in the range: the local container may hold 5450 on this runner.
      - run: PORT=5459 npm run doctor
      # New apps' CI runs the standalone conformance gate (the runner is this Mac, which has demo-kit-base).
      - name: conformance (--new)
        run: |
          gate="$HOME/Development/demo-kit-base/scripts/conformance.mjs"
          if [ ! -f "$gate" ]; then echo "conformance.mjs missing on this runner"; exit 1; fi
          node "$gate" . --tier=Demo --new
  secrets:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","macOS"]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: PATH="/opt/homebrew/bin:$PATH" gitleaks detect --source . --redact -v
      # Forbidden-strings gate: the list lives on the runner (never in the repo). The count is printed, the strings never are.
      - name: forbidden strings (history)
        run: |
          list="$HOME/.config/demo-kit/forbidden-strings.txt"
          if [ ! -f "$list" ]; then echo "forbidden-strings.txt missing on this runner"; exit 1; fi
          hits=$(git log -p --all | grep -cF -f "$list" || true)
          echo "forbidden-string hits: $hits"
          [ "$hits" = "0" ]
